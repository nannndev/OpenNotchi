[package]
name = "notchi-gateway"
version = "0.1.0"
edition = "2021"
description = "Cross-platform local AI gateway for OpenNotchi and external coding agents"

[lib]
name = "notchi_gateway"
path = "src/lib.rs"

[[bin]]
name = "notchi-gateway"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
rand = "0.8"
chrono = "0.4"
tracing = "0.1"
parking_lot = "0.12"
uuid = { version = "1.8", features = ["v4", "serde"] }
hex = "0.4"
futures = "0.3"
axum = { version = "0.7", features = ["json"] }

[dev-dependencies]
tempfile = "3.10"
# Already in the tree via axum; used to call the router in-process in tests/.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Production code must not panic on bad input or a broken database; tests may unwrap.
unwrap_used = "warn"
expect_used = "warn"
redundant_clone = "warn"
needless_collect = "warn"
