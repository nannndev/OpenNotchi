[package]
name = "opennotchi"
version = "0.1.0"
description = "OpenNotchi for Windows: now playing, synced lyrics and live activities in a pill at the top of the screen"
authors = ["OpenNotchi contributors"]
license = "MIT"
repository = "https://github.com/nannndev/OpenNotchi"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "opennotchi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2.5.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
base64 = "0.23.1"
windows = { version = "0.62.2", features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_System_Power",
  "Win32_System_Com",
] }
