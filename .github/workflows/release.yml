name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release-macos:
    name: Build macOS
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Use the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version

      - name: Check version matches tag
        run: |
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)
          if [ "v$PLIST_VERSION" != "$TAG" ]; then
            echo "Info.plist version ($PLIST_VERSION) does not match tag ($TAG)"; exit 1
          fi

      - name: Build universal app
        run: UNIVERSAL=1 ./scripts/build-app.sh release

      - name: Package
        run: ./scripts/package.sh "${TAG#v}"

      - name: Sign update and write appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            ./scripts/appcast.sh "${TAG#v}"
          else
            echo "::warning::SPARKLE_PRIVATE_KEY secret is not set; skipping the auto-update feed."
          fi

      - name: Release notes
        run: |
          ./scripts/changelog-section.sh "${TAG#v}" > notes.md
          cat >> notes.md <<'NOTES'

          ---
          **Install (macOS):** open `OpenNotchi.dmg` and drag OpenNotchi to Applications.
          The app isn't notarized yet, so on first launch go to
          **System Settings → Privacy & Security** and click **Open Anyway**.

          **Install (Windows):** run `OpenNotchi-Windows-setup.exe`.
          If Windows SmartScreen appears, click **More info** and **Run anyway**.
          NOTES

      - name: Publish GitHub release (macOS)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "OpenNotchi $TAG" --notes-file notes.md
          fi

  release-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: [release-macos]
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build --bundles nsis
      - name: Upload Windows installer to Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cp src-tauri/target/release/bundle/nsis/*.exe src-tauri/target/release/bundle/nsis/OpenNotchi-Windows-setup.exe
          gh release upload "$TAG" src-tauri/target/release/bundle/nsis/*.exe --clobber
